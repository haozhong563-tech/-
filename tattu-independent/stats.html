<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TATTU 游戏数据</title>
  <style>
    :root{color-scheme:dark;--yellow:#ffd100;--panel:#171717;--muted:#a5a5a5}*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{width:min(980px,calc(100% - 28px));margin:auto;padding:36px 0 56px}h1{margin:0;color:var(--yellow);font-size:clamp(28px,6vw,48px)}.sub{color:var(--muted);margin:6px 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:var(--panel);border:1px solid #303030;border-radius:16px;padding:18px;min-height:126px}.label{color:#c7c7c7}.value{font-size:38px;font-weight:900;color:var(--yellow);margin-top:10px}.note{margin-top:18px;padding:16px;border-left:4px solid var(--yellow);background:#111;color:#cfcfcf;border-radius:6px}button{margin-top:20px;border:0;border-radius:999px;background:var(--yellow);color:#111;font-weight:800;padding:12px 22px;cursor:pointer}#status{margin-left:12px;color:var(--muted);font-size:14px}@media(max-width:480px){main{padding-top:24px}.value{font-size:32px}}
  </style>
</head>
<body>
<main>
  <h1>TATTU 游戏数据</h1>
  <p class="sub">二维码入口与游戏效果概览</p>
  <section class="grid">
    <div class="card"><div class="label">累计打开会话</div><div class="value" id="total-opens">—</div></div>
    <div class="card"><div class="label">二维码进入会话</div><div class="value" id="qr-opens">—</div></div>
    <div class="card"><div class="label">当前在线人数</div><div class="value" id="online-now">—</div></div>
    <div class="card"><div class="label">在线人数峰值</div><div class="value" id="peak-online">—</div></div>
    <div class="card"><div class="label">累计通关次数</div><div class="value" id="total-completions">—</div></div>
    <div class="card"><div class="label">第一关通关次数</div><div class="value" id="level-1">—</div></div>
    <div class="card"><div class="label">第二关通关次数</div><div class="value" id="level-2">—</div></div>
    <div class="card"><div class="label">第一关独立通关设备</div><div class="value" id="unique-1">—</div></div>
    <div class="card"><div class="label">第二关独立通关设备</div><div class="value" id="unique-2">—</div></div>
  </section>
  <div class="note">“当前在线”按最近 45 秒仍在游戏中的设备计算；各项数据存入独立数据库，不会影响游戏加载与操作。</div>
  <button id="refresh" type="button">立即刷新</button><span id="status"></span>
</main>
<script>
  const API="https://tattu-power-rush-live-api.tattu-power-rush-live-zh191.workers.dev";
  const set=(id,value)=>document.getElementById(id).textContent=Number(value||0).toLocaleString("zh-CN");
  async function refresh(){const status=document.querySelector("#status");status.textContent="正在更新…";try{const r=await fetch(`${API}/api/analytics/stats`,{cache:"no-store"});if(!r.ok)throw new Error("stats unavailable");const d=await r.json();set("total-opens",d.totalOpens);set("qr-opens",d.qrOpens);set("online-now",d.onlineNow);set("peak-online",d.peakOnline);set("total-completions",d.totalCompletions);set("level-1",d.levelTotals?.["1"]);set("level-2",d.levelTotals?.["2"]);set("unique-1",d.uniqueFinishers?.["1"]);set("unique-2",d.uniqueFinishers?.["2"]);status.textContent=`更新时间：${new Date(d.generatedAt||Date.now()).toLocaleString("zh-CN")}`}catch{status.textContent="暂时无法读取数据，请稍后刷新。"}}
  document.querySelector("#refresh").addEventListener("click",refresh);refresh();setInterval(refresh,30000);
</script>
</body>
</html>
